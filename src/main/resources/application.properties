spring.application.name=hostel-management
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hostel_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.jwt.secret=${APP_JWT_SECRET:HostelManagementSystemSecretKeyForCollegeProjectChangeThis123456789}
app.jwt.expiration=86400000
logging.level.org.springframework.security=INFO
